<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>法衡 · AI 法律顾问</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- three.js 本地模块映射：吉祥物 3D 动效 -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<style>
/* ============================================================
   Design Tokens —— 绿色通透风格（参考 ThinkAI）
   ============================================================ */
:root{
  /* 品牌绿 */
  --green:        #22c55e;
  --green-mid:    #4ade80;
  --green-light:  #a7f3d0;
  --green-deep:   #15803d;
  --green-soft:   #eef8f0;   /* 用户气泡 / 提示卡底 */
  --green-tint:   #f5fbf6;
  --green-line:   #dcefe1;

  /* 中性 */
  --bg:       #f2f3f5;       /* 舞台底（参考图浅灰） */
  --surface:  #ffffff;
  --ink:      #171a17;
  --ink-2:    #3d443e;
  --muted:    #8b948d;
  --line:     #e6ebe7;
  --line-soft:#f0f3f0;

  --font: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;

  --fs-xxs:10px; --fs-xs:11px; --fs-sm:12px; --fs-base:13px;
  --fs-md:15px; --fs-lg:18px; --fs-xl:22px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:36px;

  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-pill:999px;

  --sh-card:  0 1px 2px rgba(24,40,28,.04);
  --sh-orb:   inset -7px -11px 18px rgba(12,90,45,.16), inset 5px 7px 14px rgba(255,255,255,.6), 0 10px 22px rgba(34,197,94,.26);

  --ease: cubic-bezier(.16,1,.3,1);
  --dur-fast:160ms; --dur-base:320ms; --dur-slow:560ms;
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; padding:0; }
:focus-visible{ outline:2px solid var(--green-deep); outline-offset:2px; border-radius:6px; }
::selection{ background:var(--green-light); color:var(--green-deep); }
.scroll{ overflow-y:auto; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }

/* ============================================================
   页面舞台（全屏真实形态）
   ============================================================ */
.stage{ min-height:100vh; min-height:100dvh; width:100%; }
.phone{ position:relative; width:100%; min-height:100vh; min-height:100dvh; }
.screen{
  position:relative; min-height:100vh; min-height:100dvh; overflow:hidden;
  background:transparent; display:flex; flex-direction:column;
}
/* 顶部淡绿青晕染（参考图核心氛围） */
.screen::before{
  content:""; position:absolute; inset:0 0 auto 0; height:64%; pointer-events:none; z-index:0;
  background:radial-gradient(112% 62% at 50% -6%, rgba(167,243,208,.62), rgba(220,252,231,.34) 40%, rgba(255,255,255,0) 76%);
}
.is-chat .screen::before{ height:48%; opacity:.62; }
/* 对话页有独立顶栏，隐藏共用顶栏 */
.is-chat .topbar{ display:none; }


/* ============================================================
   顶部栏：小 logo + 法衡 / 圆形头像
   ============================================================ */
.topbar{
  flex:none; height:46px; width:100%; max-width:520px; margin-inline:auto; padding:0 18px; position:relative; z-index:4;
  display:flex; align-items:center; justify-content:space-between;
}
.round-btn{
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,.82); border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(24,40,28,.05); color:var(--ink-2);
  transition:background var(--dur-fast), transform var(--dur-fast), color var(--dur-fast);
}
.round-btn:hover{ background:#fff; }
.round-btn:active{ transform:scale(.92); }
.round-btn svg{ width:17px; height:17px; }
.round-btn.avatar-btn{ background:var(--green-soft); color:var(--green-deep); border-color:var(--green-line); font-size:var(--fs-sm); font-weight:600; }
.round-btn.is-active{ background:var(--green); color:#fff; border-color:var(--green); }
.top-actions{ display:flex; align-items:center; gap:8px; }

/* 头像下拉菜单 */
.menu{
  position:absolute; right:16px; top:44px; z-index:12;
  width:158px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); box-shadow:0 12px 34px rgba(24,40,28,.16);
  padding:6px; opacity:0; transform:translateY(-6px) scale(.97);
  pointer-events:none; transition:all var(--dur-base) var(--ease);
}
.menu.open{ opacity:1; transform:none; pointer-events:auto; }
.menu button{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:10px; border-radius:10px; text-align:left; font-size:var(--fs-base);
  color:var(--ink-2); transition:background var(--dur-fast), color var(--dur-fast);
}
.menu button:hover{ background:var(--green-soft); color:var(--green-deep); }
.menu button svg{ width:17px; height:17px; color:var(--green-deep); }

/* ============================================================
   视图容器
   ============================================================ */
.body{ position:relative; flex:1; min-height:0; z-index:1; display:flex; flex-direction:column; }
.view{ display:none; flex:1; min-height:0; flex-direction:column; width:100%; max-width:520px; margin-inline:auto; }
.view.active{ display:flex; animation:viewIn var(--dur-base) var(--ease) both; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

/* ============================================================
   欢迎页
   ============================================================ */
.welcome{ padding:0 20px 0; }
.hero{ padding-top:34px; text-align:center; position:relative; }
/* 球体柔光：参考图的悬浮发光氛围 */
.hero::before{
  content:""; position:absolute; left:50%; top:26px; width:250px; height:250px;
  transform:translateX(-50%); pointer-events:none; z-index:0;
  background:radial-gradient(circle, rgba(74,222,128,.22) 0%, rgba(134,239,172,.11) 42%, rgba(255,255,255,0) 70%);
}
/* 3D 吉祥物容器：WebGL 就绪后淡入 canvas */
.mascot-wrap{ width:116px; height:116px; margin:0 auto 18px; position:relative; animation:float 5s ease-in-out infinite; z-index:1; }
.mascot-host{ position:absolute; inset:0; z-index:2; transition:opacity var(--dur-base); }
.mascot-fallback{
  position:absolute; left:12%; top:12%; width:76%; height:76%; border-radius:50%;
  background:linear-gradient(158deg,#4ade80,#86efac 42%,#d1fae5 78%,#f0fdf4);
  box-shadow:var(--sh-orb); z-index:1; transition:opacity var(--dur-base);
}
.mascot-fallback::after{
  content:""; position:absolute; left:28%; top:34%; width:9%; height:15%; border-radius:50%; background:#0c3527;
  box-shadow:22px 0 0 #0c3527;
}
.mascot-wrap.gl-ready .mascot-fallback{ opacity:0; }
@keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
@media (prefers-reduced-motion: reduce){ .mascot-wrap{ animation:none; } }

.title{ margin:0; font-size:23px; line-height:1.3; font-weight:700; letter-spacing:-.03em; color:var(--ink); position:relative; z-index:1; }
.subtitle{ margin:9px 0 0; font-size:13px; line-height:1.6; color:var(--muted); position:relative; z-index:1; }

/* 三张功能快捷卡 */
.features{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.feature{
  min-height:98px; padding:12px 10px; text-align:left;
  background:rgba(255,255,255,.8); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--sh-card);
  display:flex; flex-direction:column; gap:9px;
  transition:transform var(--dur-base) var(--ease), border-color var(--dur-base), background var(--dur-base), box-shadow var(--dur-base);
}
.feature:hover{ transform:translateY(-3px); border-color:var(--green-mid); background:#fff; box-shadow:0 8px 20px rgba(34,197,94,.13); }
.feature:active{ transform:translateY(-1px) scale(.98); }
.feature-ic{ width:27px; height:27px; border-radius:8px; display:grid; place-items:center; flex:none; }
.feature-ic svg{ width:15px; height:15px; }
.ic-green{ background:#dcfce7; color:#15803d; }
.ic-blue{ background:#dbeafe; color:#2563eb; }
.ic-rose{ background:#ffe4e6; color:#e11d48; }
.feature b{ display:block; font-size:12px; font-weight:600; color:var(--ink); line-height:1.3; }
.feature small{ display:block; margin-top:3px; font-size:10px; line-height:1.45; color:var(--muted); }

/* 升级提示条 */
.upgrade{
  flex:none; display:flex; align-items:center; gap:10px; margin-top:14px;
  padding:9px 11px; background:rgba(255,255,255,.8); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--sh-card);
}
.upgrade-ic{
  width:27px; height:27px; border-radius:8px; flex:none; display:grid; place-items:center;
  background:linear-gradient(140deg,#22c55e,#86efac); color:#fff;
  box-shadow:0 2px 8px rgba(34,197,94,.3);
}
.upgrade-ic svg{ width:14px; height:14px; }
.upgrade-txt{ flex:1; min-width:0; }
.upgrade-txt b{ display:block; font-size:12px; font-weight:600; color:var(--ink); }
.upgrade-txt small{ display:block; font-size:10px; color:var(--muted); margin-top:1px; }
.upgrade-x{ width:22px; height:22px; border-radius:7px; display:grid; place-items:center; color:var(--muted); flex:none; }
.upgrade-x:hover{ background:var(--green-soft); color:var(--green-deep); }
.upgrade-x svg{ width:13px; height:13px; }

.spacer{ flex:1; min-height:18px; }

/* 底部输入框（欢迎页 / 对话页共用） */
.composer{
  flex:none; margin-bottom:8px;
  border:1px solid var(--line); border-radius:var(--r-lg);
  background:var(--surface); box-shadow:0 2px 14px rgba(24,40,28,.05);
  padding:12px 13px 10px;
  transition:border-color var(--dur-base), box-shadow var(--dur-base);
}
.composer:focus-within{ border-color:var(--green-mid); box-shadow:0 0 0 3px rgba(74,222,128,.14), 0 2px 14px rgba(24,40,28,.05); }
.composer textarea{
  width:100%; min-height:34px; max-height:96px; resize:none; border:none; outline:none;
  background:transparent; font-size:var(--fs-base); line-height:1.6; color:var(--ink); padding:2px 2px 0;
}
.composer textarea::placeholder{ color:#a8b0a9; }
.composer input{
  width:100%; height:30px; border:none; outline:none; background:transparent;
  font-size:var(--fs-base); color:var(--ink);
}
.composer input::placeholder{ color:#a8b0a9; }
.composer-bar{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
.mode-pill{
  display:flex; align-items:center; gap:5px; height:26px; padding:0 9px;
  border-radius:var(--r-pill); background:var(--green-soft); color:var(--green-deep);
  font-size:var(--fs-xxs); font-weight:500; transition:background var(--dur-fast);
}
.mode-pill:hover{ background:var(--green-line); }
.mode-pill svg{ width:11px; height:11px; }
.cmp-icons{ display:flex; gap:2px; align-items:center; }
.ic-btn{ width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--muted); transition:background var(--dur-fast), color var(--dur-fast); }
.ic-btn:hover{ background:var(--green-soft); color:var(--green-deep); }
.ic-btn svg{ width:17px; height:17px; }
.send-btn{
  width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
  background:var(--green); color:#fff; box-shadow:0 3px 10px rgba(34,197,94,.32);
  transition:transform var(--dur-fast), opacity var(--dur-fast);
}
.send-btn:hover{ transform:translateY(-2px); }
.send-btn:active{ transform:scale(.9); }
.send-btn:disabled{ opacity:.4; box-shadow:none; cursor:not-allowed; transform:none; }
.send-btn svg{ width:16px; height:16px; }
.disclaimer{ flex:none; text-align:center; font-size:var(--fs-xxs); color:#a8b0a9; padding:2px 0 8px; }

/* ============================================================
   对话页
   ============================================================ */
.chat-top{
  flex:none; display:flex; align-items:center; gap:8px;
  padding:2px 18px 10px; position:relative; z-index:3;
}
.back-btn{ width:28px; height:28px; display:grid; place-items:center; color:var(--ink-2); border-radius:8px; transition:background var(--dur-fast); }
.back-btn:hover{ background:var(--green-soft); }
.back-btn svg{ width:18px; height:18px; }
.chat-title{ font-size:var(--fs-base); font-weight:600; }
.chat-status{ font-size:var(--fs-xxs); color:var(--green-deep); display:flex; align-items:center; gap:5px; margin-top:2px; }
.chat-status::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--green); }

.msgs{ flex:1; padding:6px 18px 4px; display:flex; flex-direction:column; gap:14px; }
.msg{ display:flex; gap:8px; align-items:flex-start; max-width:100%; animation:msgIn var(--dur-base) var(--ease) both; }
@keyframes msgIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.msg.user{ flex-direction:row-reverse; }
.msg-orb{
  flex:none; width:26px; height:26px; border-radius:50%; margin-top:2px;
  background:linear-gradient(158deg,#4ade80,#a7f3d0 70%,#f0fdf4);
  box-shadow:inset -3px -4px 7px rgba(12,90,45,.14), inset 2px 3px 6px rgba(255,255,255,.7);
}
.msg.user .msg-orb{ background:#e8ede8; box-shadow:none; }
.bubble{
  max-width:calc(100% - 36px); padding:11px 13px;
  font-size:var(--fs-base); line-height:1.68; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line);
  border-radius:5px var(--r-md) var(--r-md) var(--r-md);
  box-shadow:var(--sh-card);
}
.msg.user .bubble{
  background:var(--green-soft); border-color:var(--green-line); color:var(--ink);
  border-radius:var(--r-md) 5px var(--r-md) var(--r-md);
}
.bubble p{ margin:0 0 9px; } .bubble p:last-child{ margin-bottom:0; }

/* AI 结构化回答 */
.answer .lead-p{ color:var(--ink-2); }
.verdict{
  background:var(--green-soft); border-left:2px solid var(--green);
  border-radius:0 var(--r-sm) var(--r-sm) 0; padding:9px 11px; margin:10px 0;
  font-size:var(--fs-xs); line-height:1.7; color:#2f5c3c;
}
.verdict b{ color:var(--green-deep); }
.answer h4{ margin:13px 0 7px; font-size:var(--fs-base); font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px; }
.answer h4::before{ content:""; width:2px; height:12px; border-radius:2px; background:var(--green); }
.steps{ margin:0; padding-left:17px; }
.steps li{ margin-bottom:5px; line-height:1.65; }
.steps li::marker{ color:var(--green-deep); font-weight:700; }
.law-ref{ margin-top:11px; background:var(--green-tint); border:1px solid var(--green-line); border-radius:var(--r-sm); padding:9px 11px; font-size:var(--fs-xxs); color:var(--ink-2); line-height:1.65; }
.law-ref .lbl{ display:flex; align-items:center; gap:5px; color:var(--green-deep); font-weight:700; margin-bottom:3px; }
.law-ref .lbl svg{ width:12px; height:12px; }
.follow{ margin-top:11px; padding-top:9px; border-top:1px dashed var(--line); font-size:var(--fs-xs); color:var(--muted); }
.follow b{ color:var(--green-deep); }
.typing{ display:flex; gap:4px; padding:13px !important; }
.typing i{ width:5px; height:5px; border-radius:50%; background:var(--green-light); animation:blink 1.2s infinite; }
.typing i:nth-child(2){ animation-delay:.2s } .typing i:nth-child(3){ animation-delay:.4s }
@keyframes blink{ 0%,60%,100%{ opacity:.35; transform:translateY(0) } 30%{ opacity:1; transform:translateY(-3px) } }

.chat-compose{ flex:none; padding:6px 16px 0; }
.chat-note{ flex:none; text-align:center; font-size:var(--fs-xxs); color:#a8b0a9; padding:6px 0 8px; }

/* ============================================================
   功能面板（咨询记录 / 法律工具 / 我的）—— 覆盖层
   ============================================================ */
.sheet{
  position:absolute; inset:0; z-index:20; background:var(--surface);
  display:flex; flex-direction:column; transform:translateY(100%);
  transition:transform var(--dur-base) var(--ease); pointer-events:none;
}
.sheet.open{ transform:none; pointer-events:auto; }
.sheet-head{ flex:none; height:56px; padding:0 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line-soft); }
.sheet-head h3{ flex:1; margin:0; font-size:var(--fs-md); font-weight:600; }
.sheet-body{ flex:1; padding:16px 18px 24px; }
.sheet-day{ font-size:var(--fs-xxs); color:var(--muted); margin:4px 2px 10px; letter-spacing:.06em; }
.h-item{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:12px; border-radius:var(--r-md); border:1px solid var(--line);
  margin-bottom:9px; transition:border-color var(--dur-fast), background var(--dur-fast);
}
.h-item:hover{ border-color:var(--green-mid); background:var(--green-tint); }
.h-ic{ flex:none; width:30px; height:30px; border-radius:9px; background:var(--green-soft); color:var(--green-deep); display:grid; place-items:center; }
.h-ic svg{ width:15px; height:15px; }
.h-main{ flex:1; min-width:0; }
.h-main b{ display:block; font-size:var(--fs-base); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-main span{ display:block; font-size:var(--fs-xxs); color:var(--muted); margin-top:2px; }
.h-time{ flex:none; font-size:var(--fs-xxs); color:#a8b0a9; }

.tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tool-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:14px 12px; text-align:left; min-height:116px; display:flex; flex-direction:column; gap:9px;
  transition:transform var(--dur-base) var(--ease), border-color var(--dur-base), box-shadow var(--dur-base);
}
.tool-card:hover{ transform:translateY(-3px); border-color:var(--green-mid); box-shadow:0 6px 16px rgba(34,197,94,.12); }
.tool-ic-box{ width:34px; height:34px; border-radius:10px; background:var(--green-soft); color:var(--green-deep); display:grid; place-items:center; }
.tool-ic-box svg{ width:19px; height:19px; }
.tool-card h4{ margin:0; font-size:var(--fs-base); font-weight:600; }
.tool-card p{ margin:0; font-size:var(--fs-xxs); color:var(--muted); line-height:1.5; }

.me-card{ display:flex; align-items:center; gap:13px; padding:4px 2px 18px; }
.me-avatar{ width:54px; height:54px; border-radius:18px; background:linear-gradient(145deg,#4ade80,#16a34a); color:#fff; display:grid; place-items:center; font-size:var(--fs-lg); font-weight:600; box-shadow:0 6px 16px rgba(34,197,94,.28); }
.me-card b{ font-size:var(--fs-md); }
.me-card p{ margin:3px 0 0; font-size:var(--fs-xs); color:var(--muted); }
.me-stats{ display:flex; gap:9px; margin-bottom:18px; }
.me-stat{ flex:1; text-align:center; padding:12px 4px; border:1px solid var(--line); border-radius:var(--r-md); }
.me-stat b{ display:block; font-size:var(--fs-lg); color:var(--green-deep); font-variant-numeric:tabular-nums; }
.me-stat span{ font-size:var(--fs-xxs); color:var(--muted); }
.menu-card{ border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; }
.menu-row{ display:flex; align-items:center; gap:11px; width:100%; padding:13px 14px; border-bottom:1px solid var(--line-soft); text-align:left; transition:background var(--dur-fast); }
.menu-row:last-child{ border-bottom:none; }
.menu-row:hover{ background:var(--green-tint); }
.menu-row .mi{ color:var(--green-deep); display:grid; place-items:center; width:18px; }
.menu-row .mi svg{ width:17px; height:17px; }
.menu-row span{ flex:1; font-size:var(--fs-base); color:var(--ink-2); }
.menu-row .arrow{ color:#c2cbc3; }
.menu-row .arrow svg{ width:14px; height:14px; }

/* Home indicator */

/* 入场错峰 */
.rise{ opacity:0; transform:translateY(12px); }
.view.active .rise{ animation:riseIn var(--dur-slow) var(--ease) both; }
.view.active .rise:nth-child(1){ animation-delay:.02s }
.view.active .rise:nth-child(2){ animation-delay:.09s }
.view.active .rise:nth-child(3){ animation-delay:.16s }
.view.active .rise:nth-child(4){ animation-delay:.23s }
.view.active .rise:nth-child(5){ animation-delay:.30s }
@keyframes riseIn{ to{ opacity:1; transform:none } }

@media (prefers-reduced-motion: reduce){

<body>

              <input data-input type="text" placeholder="回复法衡…" autocomplete="off">

                  <button class="send-btn" data-send aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>

</div>

<script>
/* ============================================================
   交互逻辑（每个手机独立实例）
   ============================================================ */
(function(){
  const $  = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
  /* 吉祥物状态播报：供 3D 吉祥物模块订阅，联动咨询流程 */
  const emitMascot = (st) => window.dispatchEvent(new CustomEvent("mascot:state", { detail: st }));
  const scaleIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v16M7 19h10M12 6 4 8m8-2 8 2"/><path d="M4 8 2 13h4L4 8Zm16 0-2 5h4l-2-5Z"/></svg>';

  /* ---- AI 法律回复模板 ---- */
  function buildAnswer(q){
    let verdict, steps, law;
    if(/工资|劳动|辞退|合同|试用期|加班|社保/.test(q)){
      verdict='用人单位自用工之日起超过一个月不满一年未订立书面劳动合同的，应向劳动者每月支付<b>二倍工资</b>；违法解除劳动关系的，应支付赔偿金。';
      steps=['收集证据：工资流水、考勤记录、工作沟通记录、劳动合同或录用通知等；','先与单位协商解决，并保留协商过程的记录；','协商不成，向用工所在地劳动人事争议仲裁委员会申请<b>劳动仲裁</b>（一般免费）。'];
      law='《劳动合同法》第十条、第八十二条、第八十七条；《劳动争议调解仲裁法》第二十七条（仲裁时效一般为一年）。';
    }else if(/押金|房租|租房|房东|房屋|租赁/.test(q)){
      verdict='租赁期满，承租人依约返还房屋后，出租人应按约定<b>退还押金</b>；无正当理由拒不退的，承租人有权要求返还并主张逾期利息。';
      steps=['整理租赁合同、押金收据、交房时的房屋状况照片或视频；','书面（微信/短信）催告房东限期退还，固定对方拒绝的证据；','可向居委会/街道调解，或向房屋所在地法院提起<b>小额诉讼</b>。'];
      law='《民法典》第五百七十七条、第七百零三条、第七百三十三条。';
    }else if(/欠条|借钱|欠款|不还|债务|起诉/.test(q)){
      verdict='合法借贷关系受法律保护。持欠条、转账记录等债权凭证，可向被告住所地或合同履行地法院提起<b>民事诉讼</b>。';
      steps=['准备证据：欠条/借条原件、转账凭证、催收记录、对方身份信息；','向有管辖权的法院递交起诉状与证据材料，必要时申请财产保全；','胜诉后对方仍不履行，可在<b>二年内</b>申请强制执行。'];
      law='《民法典》第六百六十七条、第六百七十五条；《民事诉讼法》第一百二十二条、第二百四十三条。';
    }else if(/工伤|受伤|赔偿|车祸|交通/.test(q)){
      verdict='职工在工作时间和工作场所内因工作原因受事故伤害的，应<b>认定为工伤</b>，依法享受工伤保险待遇。';
      steps=['及时就医并保留诊断证明、病历、费用票据；','单位应在事故伤害发生之日起 <b>30 日内</b>申请工伤认定；单位不申请的，本人或近亲属可在 1 年内申请；','认定工伤后申请劳动能力鉴定，据此确定赔偿数额。'];
      law='《工伤保险条例》第十四条、第十七条、第二十一条；《社会保险法》第三十六条。';
    }else{
      verdict='你的问题涉及具体事实认定，建议先明确<b>法律关系、证据情况与诉求</b>三步，再选择协商、调解或诉讼等途径。';
      steps=['梳理事实经过，按时间线整理相关证据（合同、聊天记录、票据等）；','明确核心诉求（退款、赔偿、解除合同等）及可接受的方案；','优先协商或申请调解，成本较高时再考虑仲裁 / 诉讼。'];
      law='可结合《民法典》合同编、侵权责任编及相关单行法律综合判断。';
    }
    return '<div class="answer">'+
      '<p class="lead-p">你好，我是法衡。针对你的问题，先给你一份初步的法律分析：</p>'+
      '<div class="verdict"><b>核心结论 · </b>'+verdict+'</div>'+
      '<h4>你可以这样做</h4><ol class="steps">'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
      '<div class="law-ref"><div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M8 7h7"/></svg>法律依据</div>'+law+'</div>'+
      '<div class="follow">还需要我帮你 <b>生成维权文书</b> 或 <b>估算赔偿金额</b> 吗？可以继续提问。</div></div>';
  }

  /* ---- 功能面板内容 ---- */
  const SHEETS = {
    history: { title:'咨询记录', html:`
      <p class="sheet-day">今天</p>
      <button class="h-item" data-ask="试用期被辞退，能有补偿吗？"><span class="h-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.5-4A8 8 0 1 1 21 12Z"/></svg></span><span class="h-main"><b>试用期被辞退，能有补偿吗？</b><span>劳动争议 · 已解答</span></span><span class="h-time">09:32</span></button>
      <button class="h-item" data-ask="房东不退押金，怎么维权？"><span class="h-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.5-4A8 8 0 1 1 21 12Z"/></svg></span><span class="h-main"><b>房东不退押金，怎么维权？</b><span>房屋租赁 · 已解答</span></span><span class="h-time">昨天</span></button>
      <p class="sheet-day">本周</p>
      <button class="h-item" data-ask="欠条到期不还钱，起诉流程？"><span class="h-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.5-4A8 8 0 1 1 21 12Z"/></svg></span><span class="h-main"><b>欠条到期不还钱，起诉流程？</b><span>债权债务 · 已解答</span></span><span class="h-time">周一</span></button>
    `},
    tools: { title:'法律工具箱', html:`
      <div class="tool-grid">
        <button class="tool-card" data-ask="帮我审查一份劳动合同的风险条款"><span class="tool-ic-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></span><h4>合同审查</h4><p>识别风险条款与漏洞</p></button>
        <button class="tool-card" data-ask="帮我估算诉讼费"><span class="tool-ic-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2m4 0h2M8 15h2m4 0h2"/></svg></span><h4>诉讼费计算</h4><p>快速估算诉讼成本</p></button>
        <button class="tool-card" data-ask="帮我起草一份劳动仲裁申请书"><span class="tool-ic-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M4 20h4l10-10-4-4L4 16v4Z"/><path d="m13 6 4 4"/></svg></span><h4>文书生成</h4><p>起诉状 / 合同模板</p></button>
        <button class="tool-card" data-ask="查询劳动合同相关的法律规定"><span class="tool-ic-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Zm0 14a2 2 0 0 1 2-2h13"/><path d="M8 7h7M8 11h5"/></svg></span><h4>法条检索</h4><p>精准查询法律法规</p></button>
      </div>
    `},
    me: { title:'我的', html:`
      <div class="me-card"><div class="me-avatar">星</div><div><b>法律护航者</b><p>已加入 128 天 · 专业会员</p></div></div>
      <div class="me-stats"><div class="me-stat"><b>36</b><span>咨询次数</span></div><div class="me-stat"><b>12</b><span>我的收藏</span></div><div class="me-stat"><b>8</b><span>生成文书</span></div></div>
      <div class="menu-card">
        <button class="menu-row"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></span><span>我的收藏</span><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
        <button class="menu-row"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z"/><path d="M14 3v6h6"/></svg></span><span>我的文书</span><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
        <button class="menu-row"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8M4.6 9a1.6 1.6 0 0 0-.3-1.8"/></svg></span><span>设置</span><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
      </div>
    `}
  };

  /* ---- 每个手机实例初始化 ---- */
  $$('[data-phone]').forEach(phone=>{
    const welcome = $('.view.welcome', phone);
    const chatView = $('.view.chat', phone);
    const msgs = $('[data-msgs]', phone);
    const menu = $('.menu', phone);
    const sheet = $('[data-sheet-panel]', phone);
    const sheetBody = $('[data-sheet-body]', phone);
    const sheetTitle = $('.sheet-head h3', phone);
    /* 按时段生成问候语 */
    const hr = new Date().getHours();
    const greet = hr < 6 ? '夜深了' : hr < 11 ? '早上好' : hr < 14 ? '中午好' : hr < 18 ? '下午好' : '晚上好';
    const greetEl = $('[data-greet]', phone);
    if (greetEl) greetEl.textContent = greet + '，星火';

    /* 三张功能卡：点击直接进入对应咨询 */
    $$('[data-feature]', phone).forEach(btn => btn.addEventListener('click', () => ask(btn.dataset.feature)));

    /* 升级提示条可关闭 */
    $('[data-upgrade-close]', phone)?.addEventListener('click', () => $('[data-upgrade]', phone)?.remove());

    /* 语音按钮：联动吉祥物 listening 状态 */
    const voiceBtn = $('[data-voice]', phone);
    voiceBtn?.addEventListener('click', () => {
      emitMascot('listening'); voiceBtn.classList.add('is-active');
      setTimeout(() => { emitMascot('idle'); voiceBtn.classList.remove('is-active'); }, 1400);
    });

    function showChat(){
      welcome.classList.remove('active'); chatView.classList.add('active');
      phone.classList.add('is-chat'); scrollBottom();
      emitMascot('listening');
    }
    function showWelcome(){
      chatView.classList.remove('active'); welcome.classList.add('active');
      phone.classList.remove('is-chat');
      emitMascot('idle');
    }
    function scrollBottom(){ requestAnimationFrame(()=>{ msgs.scrollTop = msgs.scrollHeight; }); }

    function addUser(text){
      const el=document.createElement('div'); el.className='msg user';
      el.innerHTML='<div class="msg-orb"></div><div class="bubble"></div>';
      $('.bubble',el).textContent=text; msgs.appendChild(el); scrollBottom();
    }
    function addTyping(){
      const el=document.createElement('div'); el.className='msg';
      el.innerHTML='<div class="msg-orb"></div><div class="bubble typing"><i></i><i></i><i></i></div>';
      msgs.appendChild(el); scrollBottom(); return el;
    }
    function ask(question){
      if(!question||!question.trim()) return;
      showChat(); addUser(question.trim());
      emitMascot('thinking');
      const t=addTyping();
      setTimeout(()=>{
        t.remove();
        const el=document.createElement('div'); el.className='msg';
        el.innerHTML='<div class="msg-orb"></div><div class="bubble answer"></div>';
        $('.bubble',el).innerHTML=buildAnswer(question);
        msgs.appendChild(el); scrollBottom();
        emitMascot('speaking');
        setTimeout(()=>emitMascot('success'), 1600);
      },900);
    }

    /* 发送按钮 & 输入框 */
    $$('[data-send]',phone).forEach(btn=>{
      btn.addEventListener('click',()=>{
        const input = btn.closest('.composer').querySelector('[data-input]');
        ask(input.value); input.value='';
      });
    });
    $$('[data-input]',phone).forEach(input=>{
      input.addEventListener('keydown',e=>{
        if(e.key==='Enter' && !(e.shiftKey && input.tagName==='TEXTAREA')){
          e.preventDefault(); ask(input.value); input.value='';
        }
      });
    });

    $('[data-back]',phone).addEventListener('click',showWelcome);
    $('[data-home]',phone).addEventListener('click',showWelcome);

    /* 头像菜单 */
    $('[data-menu]',phone).addEventListener('click',e=>{
      e.stopPropagation(); menu.classList.toggle('open');
    });
    document.addEventListener('click',()=>menu.classList.remove('open'));

    /* 功能面板 */
    $$('[data-sheet]',phone).forEach(b=>b.addEventListener('click',()=>{
      const key=b.dataset.sheet;
      sheetTitle.textContent=SHEETS[key].title;
      sheetBody.innerHTML=SHEETS[key].html;
      sheet.classList.add('open'); menu.classList.remove('open');
      $$('[data-ask]',sheetBody).forEach(item=>item.addEventListener('click',()=>{
        sheet.classList.remove('open'); ask(item.dataset.ask);
      }));
    }));
    $('[data-close-sheet]',phone).addEventListener('click',()=>sheet.classList.remove('open'));

  });
})();
</script>

<!-- 3D 吉祥物（three.js）：订阅咨询状态，替换静态球 -->
<script type="module">
  import { createMascot } from "./vendor/mascot.js";

  const hosts = [...document.querySelectorAll("[data-mascot]")];
  const mascots = [];

  hosts.forEach((host) => {
    // 尺寸跟随容器（.mascot-wrap 为 116px）
    const m = createMascot(host, { state: "idle", color: "#34d17e", eyeColor: "#0c3527", size: 116, follow: 12, speed: 1 });
    if (!m) return; // WebGL 不可用则保留静态占位
    mascots.push(m);
    host.closest(".mascot-wrap")?.classList.add("gl-ready");
    // 点击吉祥物 → poke（开心弹跳）
    host.style.cursor = "pointer";
    host.addEventListener("click", () => m.poke());
  });

  // 咨询流程状态联动：所有吉祥物同步切换
  window.addEventListener("mascot:state", (e) => {
    const st = e.detail;
    mascots.forEach((m) => m.setState(st));
  });

  // 保持 idle 呼吸/眨眼/跟随指针；咨询流程会触发其余状态（-1 表示第一个手机是欢迎页展示态）
</script>
